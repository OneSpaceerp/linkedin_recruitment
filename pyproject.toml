[project]
name = "linkedin_recruitment"
authors = [{ name = "nsdLabs - Nest Software Development", email = "info@nsd-eg.com" }]
description = "Connects Frappe HR recruitment to LinkedIn: publish Job Openings as LinkedIn jobs and company posts, receive Easy Apply applicants as Job Applicants, and let candidates apply with their LinkedIn profile"
requires-python = ">=3.14,<3.15"
readme = "README.md"
license = "GPL-3.0-or-later"
dynamic = ["version"]
dependencies = [
    # pip packages the app imports, e.g. "defusedxml>=0.7.1"
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
hrms = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = ["E501", "B904", "W191", "E101", "F403", "F405", "E402", "RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.format]
quote-style = "double"
